<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Venue Hunt Command Center — Kyle &amp; Daina</title>
<meta name="description" content="Kyle &amp; Daina's venue hunt in Mexico: every venue, the map, vendors and the live all-in budget in one place.">
<meta name="theme-color" content="#F6F1E4">
<link rel="icon" href="../../assets/logo-b.png">
<link rel="preload" href="fonts/GT-Standard-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/GT-Standard-Medium.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/GT-Standard-Semibold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
<script>
  // theme before first paint: saved choice, else the system's
  (function () {
    var t = "auto";
    try { var s = JSON.parse(localStorage.getItem("venue-hunt-cc:v1") || "{}"); t = (s.ui && s.ui.theme) || "auto"; } catch (e) {}
    if (t === "auto") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  })();
</script>
</head>
<body>
<div class="stripe" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>

<header class="top">
  <div class="brand">
    <a class="back" href="../" aria-label="Back to the wedding pages"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <div class="brand-text">
      <span class="eyebrow" id="brandEyebrow">Kyle &amp; Daina · Nov 13, 2027</span>
      <h1><span class="h1-a">Venue Hunt </span><em>Command Center</em></h1>
    </div>
  </div>
  <nav class="tabs" role="tablist" aria-label="Sections" id="tabs"></nav>
  <div class="tools">
    <div class="guests" role="group" aria-label="Guest count used for pricing">
      <button type="button" id="gMinus" aria-label="One fewer guest"></button>
      <div class="g" title="Guest count used for every price. Set the range in the Brief."><b id="gNum">65</b><small>guests</small></div>
      <button type="button" id="gPlus" aria-label="One more guest"></button>
    </div>
    <button class="icon-btn" type="button" id="themeBtn" aria-label="Switch light or dark"></button>
    <button class="icon-btn" type="button" id="menuBtn" aria-label="More" aria-haspopup="true" aria-expanded="false"></button>
  </div>
  <div class="menu" id="menu" hidden role="menu">
    <button type="button" data-act="export" role="menuitem"></button>
    <label role="menuitem"><input type="file" id="importFile" accept="application/json,.json" hidden></label>
    <hr>
    <button type="button" data-act="theme" role="menuitem"></button>
    <button type="button" data-act="hub" role="menuitem"></button>
    <hr>
    <button type="button" data-act="wipe" class="danger" role="menuitem"></button>
    <div class="note" id="savedNote"></div>
  </div>
</header>

<main id="views">
  <section class="view" id="view-overview" data-view="overview" aria-label="Overview"></section>
  <section class="view" id="view-brief" data-view="brief" aria-label="Brief"></section>
  <section class="view" id="view-venues" data-view="venues" aria-label="Venues"></section>
  <section class="view view--map" id="view-map" data-view="map" aria-label="Map">
    <div id="map" role="application" aria-label="Map of Mexico with wedding venue pins"></div>
    <section id="mapPanel" aria-label="Browse venues on the map"></section>
    <button id="showPanel" type="button"></button>
    <div class="map-attr">Boundaries: Natural Earth · Towns: GeoNames · Prices: the atlas cost model</div>
  </section>
  <section class="view" id="view-norte" data-view="norte" aria-label="Saltillo &amp; Monterrey"></section>
  <section class="view" id="view-vendors" data-view="vendors" aria-label="Vendors"></section>
  <section class="view" id="view-budget" data-view="budget" aria-label="Budget"></section>
</main>

<nav class="bottombar" id="bottombar" role="tablist" aria-label="Sections"></nav>

<aside id="drawer" role="dialog" aria-modal="false" aria-labelledby="dwTitle" aria-hidden="true">
  <div class="dw-hero" id="dwHero"></div>
  <button class="dw-close" id="dwClose" type="button" aria-label="Close details"></button>
  <div class="dw-scroll" id="dwScroll"><div class="dw-body" id="dwBody"></div></div>
  <footer class="dw-nav">
    <button class="btn sm" id="dwPrev" type="button"></button>
    <span class="pos" id="dwPos"></span>
    <button class="btn sm" id="dwNext" type="button"></button>
  </footer>
</aside>

<div id="card" role="dialog" aria-label="Venue preview" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
